
# -------------------------------------------------------------------------------------------------
# 
# IMPORTANT NOTES
#
# This keeps the list of latest releases in sync with Spotify!
# It runs every day, rebuilds latest-releases.js and commits it only if something actually changed. 
# 
# This file was generated by Claude A.I. by Anthropic.
#
# --------------------------------------------------------------------------------------------------

name: Update latest releases # This is the name displayed for this GitHub Actions workflow.

on:
  schedule:
    - cron: "0 6 * * *" # Runs automatically every day at 06:00 UTC.
  
  workflow_dispatch: # Allows the workflow to be manually triggered from the GitHub Actions tab.

# This grants permission to commit updated release data back to the repository.
permissions:
  contents: write

# This prevents multiple update workflows from running simultaneously.
concurrency:
  group: update-releases
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest # Use the latest Ubuntu environment provided by GitHub.

    steps:
      - uses: actions/checkout@v4 # Check out the repository contents so the files can be modified.
      - uses: actions/setup-node@v4 # Set up Node.js required to run the release update script.
        
        with:
          node-version: "20"

      # Generate the latest-releases.js file using data retrieved from Spotify.
      - name: Rebuild latest-releases.js from Spotify

        # This is where Spotify API credentials are stored securely as GitHub secrets.
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node update-releases.mjs

      # Commit and push changes only when the release data has been updated.
      - name: Commit if anything changed
        
        # For the run command:
        # 1. Checks whether the latest-releases.js file has changed.
        # 2. Configure the Git identity for the automated commit.
        # 3. Commit the updated release data and push it to the repository.

        run: |
          if git diff --quiet -- latest-releases.js; then
            echo "No changes detected - nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add latest-releases.js
          git commit -m "update-releases.mjs: Daily update with the latest releases from Spotify"
          git push
